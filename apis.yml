name: Vincentage
description: 'Vincentage (Vincentage Pharma Co., Ltd.) is a clinical-stage biotech founded in 2021
  and headquartered in Suzhou, China, developing novel small-molecule drugs for metabolic and
  cardiometabolic diseases including type 2 diabetes, obesity, and MASH. Its lead candidate is
  VCT220 (also known as CX11), an oral small-molecule GLP-1 receptor agonist; worldwide rights
  (excluding Greater China) to CX11 were acquired by Corxel Pharmaceuticals. Investors include
  IDG Capital, Everest VC, Shenzhen Capital Group, Galaxy Industry Group, and Kunshan Asia Aroma.
  Surfaced as a portfolio company of IDG Capital and added to the API Evangelist network for
  enrichment; as a drug-discovery pharmaceutical company it publishes no public API, developer
  portal, or technical artifacts.'
